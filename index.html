<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RakugakiChat 2S Web</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PeerJS for Zero-Config P2P Multiplayer on GitHub Pages -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Inter:wght@400;600;700&display=swap');

    body {
      font-family: 'Inter', 'DotGothic16', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      white-space: nowrap;
    }

    .font-dot {
      font-family: 'DotGothic16', monospace;
    }

    /* Retro LCD Grid Pattern */
    .ds-lcd-bg {
      background-color: #e2e8f0;
      background-image: 
        linear-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
      background-size: 8px 8px;
    }

    /* DS Console Frame Styling */
    .ds-frame {
      box-shadow: inset 0 0 12px rgba(0,0,0,0.15), 0 8px 24px rgba(0,0,0,0.12);
    }

    .ds-screen-frame {
      box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3), inset -1px -1px 3px rgba(255,255,255,0.8);
    }

    /* Snap Scroll for Flipbook Effect */
    .snap-y-mandatory {
      scroll-snap-type: y mandatory;
    }
    .snap-start {
      scroll-snap-align: start;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #cbd5e1;
    }
    ::-webkit-scrollbar-thumb {
      background: #64748b;
      border-radius: 3px;
    }

    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-down {
      animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-800 min-h-screen flex items-center justify-center p-2 sm:p-4 text-slate-900">

  <!-- DUAL SCREEN CONSOLE HOUSING -->

  <!-- JAVASCRIPT LOGIC WITH AUTOMATIC P2P (PEERJS) & FIREBASE SYNC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, addDoc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // App ID & Firebase Configuration
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'rakugaki-chat-2s';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

    let db = null;
    let auth = null;
    let currentUser = null;
    let mySessionId = 'session_' + Math.random().toString(36).substring(2, 9);
    let isFirebaseActive = false;

    // --- PeerJS P2P Networking State ---
    let peer = null;
    let isHost = false;
    let hostConnMap = new Map();
    let clientHostConn = null;

    if (firebaseConfig) {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
        isFirebaseActive = true;
      } catch (e) {
        console.warn("Firebase fallback to PeerJS P2P mode:", e);
      }
    }

    async function initAuthAndSync() {
      if (isFirebaseActive && auth) {
        try {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            const userCred = await signInWithCustomToken(auth, __initial_auth_token);
            currentUser = userCred.user;
          } else {
            const userCred = await signInAnonymously(auth);
            currentUser = userCred.user;
          }
        } catch (err) {
          console.warn("Firebase Auth error:", err);
        }

        if (currentUser) {
          mySessionId = currentUser.uid;
        }

        if (db) {
          subscribeToRoomMessages();
          setupPresenceSystem();
        }
      } else {
        // --- GitHub Pages Standard Mode: PeerJS P2P Online Connection ---
        initPeerJSP2P();
      }
    }

    // --- PeerJS P2P Online Engine (Zero-Config) ---
    function initPeerJSP2P() {
      if (!window.Peer) return;

      if (peer) {
        try { peer.destroy(); } catch(e){}
      }
      isHost = false;
      clientHostConn = null;
      hostConnMap.clear();

      const tempId = 'user_' + Math.random().toString(36).substring(2, 9);
      peer = new Peer(tempId);

      peer.on('open', (id) => {
        mySessionId = id;
        tryConnectToRoomHost();
      });

      peer.on('error', (err) => {
        console.warn("P2P Peer error:", err);
        if (!isHost) {
          becomeRoomHost();
        }
      });
    }

    function getRoomHostId(room) {
      return 'rgk2s_room_' + room.replace(/\s+/g, '_').toLowerCase();
    }

    function tryConnectToRoomHost() {
      const targetHostId = getRoomHostId(currentRoom);
      const conn = peer.connect(targetHostId);
      let connected = false;

      conn.on('open', () => {
        connected = true;
        isHost = false;
        clientHostConn = conn;

        const userName = userNameInput.value.trim() || 'Guest';
        conn.send({
          type: 'JOIN',
          userName: userName,
          roomId: currentRoom
        });
      });

      conn.on('data', (data) => {
        handleP2PClientData(data);
      });

      conn.on('close', () => {
        if (!isHost) {
          showSysNotification(`${currentRoom} の通信が切断されました。再接続を試みています...`);
          setTimeout(() => becomeRoomHost(), 1500);
        }
      });

      // Timeout fallback: if no host responds in 2.5s, become the room host!
      setTimeout(() => {
        if (!connected && !isHost) {
          try { conn.close(); } catch(e){}
          becomeRoomHost();
        }
      }, 2500);
    }

    function becomeRoomHost() {
      if (isHost) return;

      if (peer) {
        try { peer.destroy(); } catch(e){}
      }

      const hostId = getRoomHostId(currentRoom);
      peer = new Peer(hostId);

      peer.on('open', () => {
        isHost = true;
        showSysNotification(`${currentRoom} のホストになりました（オンライン待機中）`);
      });

      peer.on('connection', (conn) => {
        conn.on('open', () => {
          // Connected new peer
        });

        conn.on('data', (data) => {
          handleP2PHostData(data, conn);
        });

        conn.on('close', () => {
          if (conn.userName) {
            const leaveMsg = `${conn.roomId || currentRoom} から ${conn.userName} が退室しました`;
            showSysNotification(leaveMsg);
            broadcastToClients({ type: 'SYS_NOTIF', text: leaveMsg }, conn.peer);
          }
          hostConnMap.delete(conn.peer);
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          isHost = false;
          setTimeout(() => initPeerJSP2P(), 1000);
        }
      });
    }

    function handleP2PHostData(data, conn) {
      if (data.type === 'JOIN') {
        conn.userName = data.userName;
        conn.roomId = data.roomId;
        hostConnMap.set(conn.peer, conn);

        const joinMsg = `${data.roomId} に ${data.userName} が入室しました`;
        showSysNotification(joinMsg);
        broadcastToClients({ type: 'SYS_NOTIF', text: joinMsg }, conn.peer);

        // Send chat history to newly joined user
        conn.send({
          type: 'SYNC_LOG',
          roomId: currentRoom,
          messages: roomMessages[currentRoom] || []
        });
      } else if (data.type === 'NEW_MSG') {
        if (!roomMessages[currentRoom]) roomMessages[currentRoom] = [];
        roomMessages[currentRoom].push(data.message);
        renderChatLog();
        broadcastToClients({ type: 'NEW_MSG', roomId: currentRoom, message: data.message });
      } else if (data.type === 'CLEAR_LOG') {
        roomMessages[currentRoom] = [];
        renderChatLog();
        broadcastToClients({ type: 'CLEAR_LOG', roomId: currentRoom });
      }
    }

    function handleP2PClientData(data) {
      if (data.type === 'SYNC_LOG') {
        roomMessages[data.roomId] = data.messages || [];
        renderChatLog();
      } else if (data.type === 'NEW_MSG') {
        if (!roomMessages[data.roomId]) roomMessages[data.roomId] = [];
        roomMessages[data.roomId].push(data.message);
        if (data.roomId === currentRoom) {
          renderChatLog();
        }
      } else if (data.type === 'CLEAR_LOG') {
        roomMessages[data.roomId] = [];
        if (data.roomId === currentRoom) {
          renderChatLog();
        }
      } else if (data.type === 'SYS_NOTIF') {
        showSysNotification(data.text);
      }
    }

    function broadcastToClients(data, excludePeerId = null) {
      hostConnMap.forEach((conn, peerId) => {
        if (peerId !== excludePeerId && conn.open) {
          conn.send(data);
        }
      });
    }

    // --- Firebase Sync System (When Config Exists) ---
    function subscribeToRoomMessages() {
      if (!db) return;

      const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'messages');

      onSnapshot(messagesRef, (snapshot) => {
        const docs = snapshot.docs.map(docSnap => ({
          id: docSnap.id,
          ...docSnap.data()
        }));

        docs.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

        const updatedRooms = { 'Room A': [], 'Room B': [], 'Room C': [], 'Room D': [] };
        docs.forEach(msg => {
          const roomKey = msg.roomId || 'Room A';
          if (updatedRooms[roomKey]) {
            updatedRooms[roomKey].push(msg);
          }
        });

        roomMessages = updatedRooms;
        renderChatLog();
      }, (error) => {
        console.error("Error listening to shared chat messages:", error);
      });
    }

    // --- Presence System (Join / Leave / Room Switch Detection) ---
    let previousPresenceMap = null;
    let presenceHeartbeatTimer = null;

    function setupPresenceSystem() {
      if (!db) return;

      updatePresenceDoc();

      presenceHeartbeatTimer = setInterval(() => {
        updatePresenceDoc();
      }, 10000);

      window.addEventListener('beforeunload', () => {
        removePresenceDoc();
      });

      const presenceRef = collection(db, 'artifacts', appId, 'public', 'data', 'presence');

      onSnapshot(presenceRef, (snapshot) => {
        const currentPresenceMap = new Map();
        const now = Date.now();

        snapshot.docs.forEach(docSnap => {
          const data = docSnap.data();
          if (data && data.lastSeen && (now - data.lastSeen < 25000)) {
            currentPresenceMap.set(docSnap.id, data);
          }
        });

        if (previousPresenceMap !== null) {
          currentPresenceMap.forEach((user, id) => {
            if (id === mySessionId) return;

            if (!previousPresenceMap.has(id)) {
              showSysNotification(`${user.roomId} に ${user.userName || 'Guest'} が入室しました`);
            } else {
              const oldUser = previousPresenceMap.get(id);
              if (oldUser.roomId !== user.roomId) {
                showSysNotification(`${user.userName || 'Guest'} が ${oldUser.roomId} から ${user.roomId} に移動しました`);
              }
            }
          });

          previousPresenceMap.forEach((user, id) => {
            if (id === mySessionId) return;
            if (!currentPresenceMap.has(id)) {
              showSysNotification(`${user.roomId} から ${user.userName || 'Guest'} が退室しました`);
            }
          });
        }

        previousPresenceMap = currentPresenceMap;
      });
    }

    // --- Retro SFX Engine (Web Audio API) ---
    class RetroSFX {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Organic DS Send Sound (Hyupo / ヒュポッ)
      playSend() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const osc1 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(280, now);
        osc1.frequency.exponentialRampToValueAtTime(1100, now + 0.035);
        gain1.gain.setValueAtTime(0.18, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
        osc1.connect(gain1);
        gain1.connect(this.ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.035);

        const start2 = now + 0.025;
        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(800, start2);
        osc2.frequency.exponentialRampToValueAtTime(180, start2 + 0.065);
        gain2.gain.setValueAtTime(0.25, start2);
        gain2.gain.exponentialRampToValueAtTime(0.001, start2 + 0.065);
        osc2.connect(gain2);
        gain2.connect(this.ctx.destination);
        osc2.start(start2);
        osc2.stop(start2 + 0.065);
      }

      // Soft Key Tap Sound
      playKeyType() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.02);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.02);
      }

      // Pen Scratching Sound
      playStroke() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.015;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 2400;
        filter.Q.value = 3.0;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.015);

        whiteNoise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        whiteNoise.start(now);
      }

      // Clear Canvas Sound
      playClear() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }

      // DS System Notification Chime (Pikon!)
      playNotification() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.setValueAtTime(1760, now + 0.06);
        
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function startDraw(e) {
      isDrawing = true;
      const pos = getCanvasPos(e);
      startX = pos.x;
      startY = pos.y;
      snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.strokeStyle = (currentTool === 'eraser') ? '#ffffff' : '#000000';
      ctx.lineWidth = (currentTool === 'eraser') ? currentSize * 2.5 : currentSize;
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getCanvasPos(e);
      sound.playStroke();

      if (currentTool === 'pen' || currentTool === 'eraser') {
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else if (currentTool === 'line') {
        ctx.putImageData(snapshot, 0, 0);
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else if (currentTool === 'rect') {
        ctx.putImageData(snapshot, 0, 0);
        ctx.beginPath();
        ctx.rect(startX, startY, pos.x - startX, pos.y - startY);
        ctx.stroke();
      }
    }

    function stopDraw() {
      isDrawing = false;
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);

        ) {
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const dropX = (e.clientX - rect.left) * scaleX;
          const dropY = (e.clientY - rect.top) * scaleY;

          stampChar(activeDragChar, dropX, dropY);
          cursorX = dropX + 16;

    function typeCharOnCanvas(char) {

      flipIndex = 0;
      flipbookModal.classList.remove('hidden');
      startFlipbook();
    });

    closeFlipbookBtn.addEventListener('click', stopFlipbook);

    function startFlipbook() {
      const list = roomMessages[currentRoom] || [];
      if (list.length === 0) return;
      isPlaying = true;
      flipbookPlayIcon.className = 'fa-solid fa-pause';

      clearInterval(flipInterval);
      const fps = parseInt(flipbookSpeed.value, 10);
      flipInterval = setInterval(() => {
        flipIndex = (flipIndex + 1) % list.length;
        updateFlipFrame();
      }, 1000 / fps);
      updateFlipFrame();
    }

    function stopFlipbook() {
      isPlaying = false;
      clearInterval(flipInterval);
      flipbookModal.classList.add('hidden');
    }

    function updateFlipFrame() {
      const list = roomMessages[currentRoom] || [];
      if (list.length === 0) return;
      flipbookImage.src = list[flipIndex].image;
      flipbookFrameNum.textContent = `${flipIndex + 1}/${list.length}`;
    }

    flipbookSpeed.addEventListener('input', (e) => {
      flipbookFps.textContent = `${e.target.value} fps`;
      if (isPlaying) startFlipbook();
    });

    flipbookPlayToggle.addEventListener('click', () => {
      if (isPlaying) {
        isPlaying = false;
        clearInterval(flipInterval);
        flipbookPlayIcon.className = 'fa-solid fa-play';
      } else {
        startFlipbook();
      }
    });

    document.getElementById('flipbookPrev').addEventListener('click', () => {
      const list = roomMessages[currentRoom] || [];
      if (list.length === 0) return;
      flipIndex = (flipIndex - 1 + list.length) % list.length;
      updateFlipFrame();
    });

    document.getElementById('flipbookNext').addEventListener('click', () => {
      const list = roomMessages[currentRoom] || [];
      if (list.length === 0) return;
      flipIndex = (flipIndex + 1) % list.length;
      updateFlipFrame();
    });

    const confirmModal = document.getElementById('confirmModal');
    const clearRoomLogBtn = document.getElementById('clearRoomLogBtn');
    const confirmCancelBtn = document.getElementById('confirmCancelBtn');
    const confirmOkBtn = document.getElementById('confirmOkBtn');

    clearRoomLogBtn.addEventListener('click', () => {
      confirmModal.classList.remove('hidden');
    });

    confirmCancelBtn.addEventListener('click', () => {
      confirmModal.classList.add('hidden');
    });

    confirmOkBtn.addEventListener('click', async () => {
      const listToDelete = [...(roomMessages[currentRoom] || [])];
      roomMessages[currentRoom] = [];
      renderChatLog();
      confirmModal.classList.add('hidden');
      sound.playClear();

      if (isFirebaseActive && db && currentUser) {
        for (const msg of listToDelete) {
          if (msg.id) {
            try {
              const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'messages', msg.id);
              await deleteDoc(docRef);
            } catch (e) {
              console.error("Error clearing msg from database:", e);
            }
          }
        }
      } else {
        if (isHost) {
          broadcastToClients({ type: 'CLEAR_LOG', roomId: currentRoom });
        } else if (clientHostConn && clientHostConn.open) {
          clientHostConn.send({ type: 'CLEAR_LOG', roomId: currentRoom });
        }
      }
    });
  </script>
</body>
</html>
